project_id = "family-city-dashboard"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://3d-home-dashboard.vercel.app"
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Keep the email provider enabled; global auth.enable_signup still blocks registration.
enable_signup = true
enable_confirmations = true
